<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">

    <header>
        <h1>Layout Sederhana</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="artikel.html">Artikel</a>
        <a href="about.html">About</a>
        <a href="kontak.html" class="active">Kontak</a>
    </nav>

    <section id="hero">
        <h1>Hubungi Kami</h1>
        <p>Silakan isi formulir di bawah ini.</p>
    </section>

    <section id="wrapper">
        <section id="main">
            <h2>Formulir Kontak</h2>

            <form action="#" method="post">
                <p>
                    <label for="nama">Nama Lengkap</label><br>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap" required>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email"
                           placeholder="Masukkan email" required>
                </p>

                <p>
                    <label for="pesan">Pesan</label><br>
                    <textarea id="pesan" name="pesan"
                              placeholder="Tulis pesan kamu"
                              rows="5" required></textarea>
                </p>

                <button type="submit" class="btn">Kirim Pesan</button>
            </form>
        </section>

        <aside id="sidebar">
            <div class="widget-box">
                <h3 class="title">Informasi Kontak</h3>
                <p>Halaman latihan formulir kontak.</p>
            </div>
        </aside>
    </section>

    <footer>
        <p>&copy; 2026 - Universitas Pelita Bangsa</p>
    </footer>

</div>

</body>
</html>
